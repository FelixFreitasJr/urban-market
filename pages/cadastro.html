<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="../css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">


    <title>Urban Market</title>
</head>

<body>
    <header>
        <div class="logo">
            <img src="../img/logo.png" alt="Logo Urban Market">
        </div>
        <p>Qualidade e praticidade todos os dias.</p>
    </header>

    <nav>
        <a href="../index.html">Início</a>
        <a href="sobre.html">Sobre a Empresa</a>
        <a href="tabela.html">Produtos</a>
        <a href="cadastro.html">Cadastro</a>
    </nav>

    <main>
        <h2>Cadastro de Produtos</h2>

        <form>

            <label for="codigo">Código:</label>
            <input type="number" id="codigo" name="codigo" required>

            <label for="produto">Nome do Produto:</label>
            <input type="text" id="produto" name="produto" required>

            <label for="preco">Preço unitario:</label>
            <input type="number" id="preco" name="preco" step="0.01" required>

            <label for="fabricante">Fabricante</label>
            <select id="fabricante" name="fabricante" required>
                <option value="">Selecione um fabricante</option>
                <option value="Nestle">Nestlé</option>
                <option value="Unilever">Unilever</option>
                <option value="Camil">Camil</option>
                <option value="Itambe">Itambé</option>
            </select>

            <label for="data">Data de Cadastro:</label>
            <input type="date" name="data" id="data" required>

            <div class="actions">
                <button type="submit">Cadastrar</button>
                <button type="reset">Limpar</button>
            </div>
        </form>
    </main>

    <footer>
        <p>&copy;2026 Urban Market - Todos os direitos reservados.</p>

        <div class="redes-sociais">
            <a href="#">
                <img src="../img/facebook.png" alt="Facebook"></a>

            <a href="#">
                <img src="../img/instagram.png" alt="Instagram"></a>

            <a href="#">
                <img src="../img/twitter.png" alt="X/twitter"></a>

            <a href="#">
                <img src="../img/youtube.png" alt="YouTube"></a>
        </div>

        <p>
            <a href="../index.html">Voltar para o inicio</a>
        </p>
    </footer>

</body>

</html>
